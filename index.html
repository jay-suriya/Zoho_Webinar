<title>Zoho CRM &rlm;⇌&rlm; Zoho Webinar</title>

<link rel="canonical" href="webinar.html">
<style>
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:#fafafa;
         color:#313949; display:flex; align-items:center; justify-content:center; height:100vh; }
  a { color:#5464F2; }
</style>
</head>
<body>
  <p>Opening the mock&hellip; if nothing happens, <a href="webinar.html">open webinar.html</a>.</p>
  <script>location.replace('webinar.html' + location.search + location.hash);</script>
</body>
</html>
